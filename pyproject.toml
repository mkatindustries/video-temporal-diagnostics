[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-temporal-diagnostics"
version = "0.1.0"
description = "Diagnostic framework for temporal sensitivity in video retrieval embeddings"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.56.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "av>=10.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
vlm = [
    "accelerate>=0.26.0",
    "qwen-vl-utils>=0.0.8",
    "bitsandbytes>=0.46.1",
    "einops>=0.7.0",
    "timm>=0.9.0",
    "ftfy>=6.1.0",
    "requests>=2.31.0",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "isort>=5.12.0",
    "pyrefly>=0.1.0",
]
# Everything poster/ needs beyond the base install. matplotlib and numpy are core
# dependencies already; pillow is listed because build_poster.py imports PIL
# directly rather than relying on matplotlib to pull it in.
poster = [
    "reportlab>=4.0.0",
    "qrcode>=7.4",
    "pillow>=9.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["video_retrieval*"]

[project.scripts]
temporal-diag = "video_retrieval.diagnostics.cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
# poster/ imports its sibling module directly, so it is first-party there.
known-first-party = ["tokens", "video_retrieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
search-path = ["experiments"]
replace-imports-with-any = ["tqdm"]
ignore-missing-imports = [
    "av",
    "cv2",
    "datasets",
    "huggingface_hub",
    "matplotlib",
    "matplotlib.lines",
    "matplotlib.patches",
    "matplotlib.pyplot",
    "PIL",
    "pytest",
    "qrcode",
    "qwen_vl_utils",
    "reportlab",
    "reportlab.lib.colors",
    "reportlab.lib.units",
    "reportlab.pdfbase",
    "reportlab.pdfbase.ttfonts",
    "reportlab.pdfgen",
    "scipy",
    "scipy.optimize",
    "scipy.stats",
    "sklearn",
    "sklearn.cluster",
    "sklearn.linear_model",
    "sklearn.metrics",
    "sklearn.model_selection",
    "sklearn.neural_network",
    "sklearn.preprocessing",
    "torch",
    "torch.nn",
    "torch.nn.functional",
    "torchvision",
    "torchvision.models.optical_flow",
    "transformers",
]
